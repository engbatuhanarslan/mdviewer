name: Portable packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            command: npm run package:mac:arm
            artifact: dist/local-md-macos-arm64
          - name: macos-intel
            os: macos-13
            command: npm run package:mac:intel
            artifact: dist/local-md-macos-intel
          - name: windows-x64
            os: windows-latest
            command: npm run package:windows
            artifact: dist/Local-MD.exe
          - name: linux-x64
            os: ubuntu-latest
            command: npm run package:linux
            artifact: dist/local-md-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: local-md-${{ matrix.name }}
          path: ${{ matrix.artifact }}
